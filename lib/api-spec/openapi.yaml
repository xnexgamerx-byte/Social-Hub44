              schema:
                $ref: "#/components/schemas/Error"
components:
  schemas:
    SupportContact:
      type: object
      properties:
        userId:
          type: string
        name:
          type: string
        avatar:
          type: string
      required:
        - userId
        - name
        - avatar
    UserSettings:
      type: object
      properties:
        notifyDm:
          type: string
          enum: [all, none]
        notifyLikes:
          type: boolean
        notifyMoments:
          type: boolean
        whoCanDm:
          type: string
          enum: [all, following, none]
        hideOnline:
          type: boolean
        invisibleRoomEntry:
          type: boolean
        language:
          type: string
      required:
        - notifyDm
        - notifyLikes
        - notifyMoments
        - whoCanDm
        - hideOnline
        - invisibleRoomEntry
        - language
    UserSettingsPatch:
      type: object
      description: >-
        Every field is optional. Fields that are omitted keep whatever value is
        already stored, so a client toggling one switch cannot blank the rest.
      properties:
        notifyDm:
          type: string
          enum: [all, none]
        notifyLikes:
          type: boolean
        notifyMoments:
          type: boolean
        whoCanDm:
          type: string
          enum: [all, following, none]
        hideOnline:
          type: boolean
        invisibleRoomEntry:
          type: boolean
        language:
          type: string
          enum: [ar]
    HealthStatus:
      type: object
      properties:
        status:
          type: string
        voice:
          type: boolean
        storage:
          type: boolean
      required:
        - status
        - voice
        - storage
    AuthMe:
      type: object
      properties:
        userId:
          type: string
        isAdmin:
          type: boolean
        isOwner:
          type: boolean
      required:
        - userId
        - isAdmin
        - isOwner
    Admin:
      type: object
      required:
        - id
        - email
        - userId
        - addedBy
        - source
        - removable
      properties:
        id: { type: integer }
        email: { type: string }
        userId: { type: string }
        addedBy: { type: string }
        source: { type: string }
        removable: { type: boolean }
    AdminInput:
      type: object
      required:
        - email
      properties:
        email: { type: string, minLength: 3 }
    AdminAuditEvent:
      type: object
      required:
        - id
        - action
        - targetEmail
        - actorEmail
        - createdAt
      properties:
        id: { type: integer }
        action: { type: string }
        targetEmail: { type: string }
        actorEmail: { type: string }
        createdAt: { type: string }
    WalletLookup:
      type: object
      required:
        - userId
        - publicId
        - displayName
        - coins
        - vPoints
      properties:
        userId: { type: string }
        publicId: { type: string }
        displayName: { type: string }
        coins: { type: integer }
        vPoints: { type: integer }
    GrantCoinsInput:
      type: object
      required:
        - publicId
        - amount
        - currency
      properties:
        publicId: { type: string, minLength: 1 }
        amount: { type: integer }
        currency: { type: string, enum: [coins, V] }
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    Room:
      type: object
      required:
        - id
        - name
        - description
        - category
        - ownerId
        - ownerName
        - ownerAvatar
        - tags
        - active
        - createdAt
      properties:
        id: { type: integer }
        name: { type: string }
        description: { type: string }
        category: { type: string }
        ownerId: { type: string }
        ownerName: { type: string }
        ownerAvatar: { type: string }
        tags:
          type: array
          items: { type: string }
        active: { type: boolean }
        createdAt: { type: string }
    RoomInput:
      type: object
      required:
        - name
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 200 }
        category: { type: string, enum: [chat, gaming, music, family] }
        tags:
          type: array
          items: { type: string }
        ownerName: { type: string }
        ownerAvatar: { type: string }
    RoomUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1, maxLength: 60 }
        description: { type: string, maxLength: 200 }
        category: { type: string, enum: [chat, gaming, music, family] }
        tags:
          type: array
          items: { type: string }
        active: { type: boolean }

    Conversation:
      type: object
      required:
        - id
        - otherUserId
        - otherName
        - otherAvatar
        - lastText
        - lastFromId
        - lastAt
        - unread
      properties:
        id: { type: integer }
        otherUserId: { type: string }
        otherName: { type: string }
        otherAvatar: { type: string }
        lastText: { type: string }
        lastFromId: { type: string }
        lastAt: { type: string }
        unread: { type: integer }
    OpenConversationInput:
      type: object
      required:
        - otherUserId
      properties:
        otherUserId: { type: string, minLength: 1 }
        otherName: { type: string }
        otherAvatar: { type: string }
    DmMessage:
      type: object
      required:
        - id
        - conversationId
        - fromUserId
        - fromName
        - fromAvatar
        - text
        - createdAt
      properties:
        id: { type: integer }
        conversationId: { type: integer }
        fromUserId: { type: string }
        fromName: { type: string }
        fromAvatar: { type: string }
        text: { type: string }
        createdAt: { type: string }

    StoreItem:
      type: object
      required:
        - id
        - name
        - category
        - itemType
        - section
        - imageUrl
        - mediaUrl
        - color
        - icon
        - price
        - currency
        - vipRequired
        - durationDays
        - active
        - sortOrder
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        itemType: { type: string }
        section: { type: string }
        imageUrl: { type: string }
        mediaUrl: { type: string }
        color: { type: string }
        icon: { type: string }
        price: { type: integer }
        currency: { type: string }
        vipRequired: { type: integer }
        durationDays: { type: integer }
