openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: store
    description: Store item operations
  - name: vip
    description: VIP tier and feature operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /store-items:
    get:
      operationId: listStoreItems
      tags: [store]
      summary: List store items
      responses:
        "200":
          description: List of store items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreItem"
    post:
      operationId: createStoreItem
      tags: [store]
      summary: Create a store item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreItemInput"
      responses:
        "201":
          description: Created store item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreItem"
  /store-items/{id}:
    patch:
      operationId: updateStoreItem
      tags: [store]
      summary: Update a store item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreItemUpdate"
      responses:
        "200":
          description: Updated store item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteStoreItem
      tags: [store]
      summary: Delete a store item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /vip-tiers:
    get:
      operationId: listVipTiers
      tags: [vip]
      summary: List VIP tiers
      responses:
        "200":
          description: List of VIP tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VipTier"
    post:
      operationId: createVipTier
      tags: [vip]
      summary: Create a VIP tier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VipTierInput"
      responses:
        "201":
          description: Created VIP tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VipTier"
  /vip-tiers/{id}:
    patch:
      operationId: updateVipTier
      tags: [vip]
      summary: Update a VIP tier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VipTierUpdate"
      responses:
        "200":
          description: Updated VIP tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VipTier"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteVipTier
      tags: [vip]
      summary: Delete a VIP tier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /vip-features:
    get:
      operationId: listVipFeatures
      tags: [vip]
      summary: List VIP features
      responses:
        "200":
          description: List of VIP features
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VipFeature"
    post:
      operationId: createVipFeature
      tags: [vip]
      summary: Create a VIP feature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VipFeatureInput"
      responses:
        "201":
          description: Created VIP feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VipFeature"
  /vip-features/{id}:
    patch:
      operationId: updateVipFeature
      tags: [vip]
      summary: Update a VIP feature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VipFeatureUpdate"
      responses:
        "200":
          description: Updated VIP feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VipFeature"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteVipFeature
      tags: [vip]
      summary: Delete a VIP feature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    StoreItem:
      type: object
      required:
        - id
        - name
        - category
        - section
        - imageUrl
        - color
        - icon
        - price
        - currency
        - vipRequired
        - durationDays
        - active
        - sortOrder
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        section: { type: string }
        imageUrl: { type: string }
        color: { type: string }
        icon: { type: string }
        price: { type: integer }
        currency: { type: string }
        vipRequired: { type: integer }
        durationDays: { type: integer }
        active: { type: boolean }
        sortOrder: { type: integer }
    StoreItemInput:
      type: object
      required:
        - name
        - category
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        section: { type: string }
        imageUrl: { type: string }
        color: { type: string }
        icon: { type: string }
        price: { type: integer }
        currency: { type: string }
        vipRequired: { type: integer }
        durationDays: { type: integer }
        active: { type: boolean }
        sortOrder: { type: integer }
    StoreItemUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        section: { type: string }
        imageUrl: { type: string }
        color: { type: string }
        icon: { type: string }
        price: { type: integer }
        currency: { type: string }
        vipRequired: { type: integer }
        durationDays: { type: integer }
        active: { type: boolean }
        sortOrder: { type: integer }

    VipFeature:
      type: object
      required:
        - id
        - key
        - label
        - description
        - icon
        - sortOrder
      properties:
        id: { type: integer }
        key: { type: string }
        label: { type: string }
        description: { type: string }
        icon: { type: string }
        sortOrder: { type: integer }
    VipFeatureInput:
      type: object
      required:
        - key
        - label
      properties:
        key: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        description: { type: string }
        icon: { type: string }
        sortOrder: { type: integer }
    VipFeatureUpdate:
      type: object
      properties:
        key: { type: string, minLength: 1 }
        label: { type: string, minLength: 1 }
        description: { type: string }
        icon: { type: string }
        sortOrder: { type: integer }

    VipTier:
      type: object
      required:
        - id
        - level
        - type
        - pointsRequired
        - color
        - features
        - active
      properties:
        id: { type: integer }
        level: { type: integer }
        type: { type: string }
        pointsRequired: { type: integer }
        color: { type: string }
        features:
          type: array
          items: { type: string }
        active: { type: boolean }
    VipTierInput:
      type: object
      required:
        - level
      properties:
        level: { type: integer }
        type: { type: string }
        pointsRequired: { type: integer }
        color: { type: string }
        features:
          type: array
          items: { type: string }
        active: { type: boolean }
    VipTierUpdate:
      type: object
      properties:
        level: { type: integer }
        type: { type: string }
        pointsRequired: { type: integer }
        color: { type: string }
        features:
          type: array
          items: { type: string }
        active: { type: boolean }
