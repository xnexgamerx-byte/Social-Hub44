openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: store
    description: Store item operations
  - name: vip
    description: VIP tier and feature operations
  - name: economy
    description: Coin packages and daily task catalog operations
  - name: wallet
    description: Per-user wallet, ledger, ownership and spend/earn operations
  - name: auth
    description: Authentication and authorization operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Current authenticated user
      description: Returns the verified user id and whether they are an admin
      responses:
        "200":
          description: Authenticated user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admins:
    get:
      operationId: listAdmins
      tags: [auth]
      summary: List admins
      description: Returns the bootstrap (env) owners and in-app granted admins
      responses:
        "200":
          description: List of admins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Admin"
    post:
      operationId: createAdmin
      tags: [auth]
      summary: Grant admin access to an email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInput"
      responses:
        "201":
          description: Created admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "400":
          description: Invalid email or already an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admins/{id}:
    delete:
      operationId: deleteAdmin
      tags: [auth]
      summary: Revoke admin access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot remove yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admins/audit:
    get:
      operationId: listAdminAudit
      tags: [auth]
      summary: List admin grant/revoke history
      description: Returns the most recent admin grant and revoke actions
      responses:
        "200":
          description: List of admin audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAuditEvent"

  /store-items:
    get:
      operationId: listStoreItems
      tags: [store]
      summary: List store items
      responses:
        "200":
          description: List of store items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreItem"
    post:
      operationId: createStoreItem
      tags: [store]
      summary: Create a store item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreItemInput"
      responses:
        "201":
          description: Created store item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreItem"
  /store-items/{id}:
    patch:
      operationId: updateStoreItem
      tags: [store]
      summary: Update a store item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreItemUpdate"
      responses:
        "200":
          description: Updated store item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteStoreItem
      tags: [store]
      summary: Delete a store item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /vip-tiers:
    get:
      operationId: listVipTiers
      tags: [vip]
      summary: List VIP tiers
      responses:
        "200":
          description: List of VIP tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VipTier"
    post:
      operationId: createVipTier
      tags: [vip]
      summary: Create a VIP tier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VipTierInput"
      responses:
        "201":
          description: Created VIP tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VipTier"
  /vip-tiers/{id}:
    patch:
      operationId: updateVipTier
      tags: [vip]
      summary: Update a VIP tier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VipTierUpdate"
      responses:
        "200":
          description: Updated VIP tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VipTier"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteVipTier
      tags: [vip]
      summary: Delete a VIP tier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /vip-features:
    get:
      operationId: listVipFeatures
      tags: [vip]
      summary: List VIP features
      responses:
        "200":
          description: List of VIP features
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VipFeature"
    post:
      operationId: createVipFeature
      tags: [vip]
      summary: Create a VIP feature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VipFeatureInput"
      responses:
        "201":
          description: Created VIP feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VipFeature"
  /vip-features/{id}:
    patch:
      operationId: updateVipFeature
      tags: [vip]
      summary: Update a VIP feature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VipFeatureUpdate"
      responses:
        "200":
          description: Updated VIP feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VipFeature"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteVipFeature
      tags: [vip]
      summary: Delete a VIP feature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /coin-packages:
    get:
      operationId: listCoinPackages
      tags: [economy]
      summary: List coin packages
      responses:
        "200":
          description: List of coin packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoinPackage"
    post:
      operationId: createCoinPackage
      tags: [economy]
      summary: Create a coin package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoinPackageInput"
      responses:
        "201":
          description: Created coin package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoinPackage"
  /coin-packages/{id}:
    patch:
      operationId: updateCoinPackage
      tags: [economy]
      summary: Update a coin package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoinPackageUpdate"
      responses:
        "200":
          description: Updated coin package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoinPackage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteCoinPackage
      tags: [economy]
      summary: Delete a coin package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /daily-tasks:
    get:
      operationId: listDailyTasks
      tags: [economy]
      summary: List daily tasks
      responses:
        "200":
          description: List of daily tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyTask"
    post:
      operationId: createDailyTask
      tags: [economy]
      summary: Create a daily task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyTaskInput"
      responses:
        "201":
          description: Created daily task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyTask"
  /daily-tasks/{id}:
    patch:
      operationId: updateDailyTask
      tags: [economy]
      summary: Update a daily task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyTaskUpdate"
      responses:
        "200":
          description: Updated daily task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyTask"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteDailyTask
      tags: [economy]
      summary: Delete a daily task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /wallet/{userId}:
    get:
      operationId: getWallet
      tags: [wallet]
      summary: Get a user's wallet (auto-creates if missing)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
  /wallet/{userId}/ensure:
    post:
      operationId: ensureWallet
      tags: [wallet]
      summary: Ensure a wallet exists, seeding a fixed server-side welcome balance on first create
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
  /wallet/{userId}/transactions:
    get:
      operationId: listWalletTransactions
      tags: [wallet]
      summary: List a user's wallet transaction history
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Transaction history (newest first)
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WalletTransaction"
  /wallet/{userId}/recharge:
    post:
      operationId: rechargeWallet
      tags: [wallet]
      summary: Recharge coins by purchasing a coin package
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RechargeInput"
      responses:
        "200":
          description: Updated wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "404":
          description: Package not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /wallet/{userId}/recharge/reconcile:
    post:
      operationId: reconcileRecharges
      tags: [wallet]
      summary: Credit any paid-but-uncredited coin purchases for this customer
      description: >-
        Recovery path for purchases that were charged by the store but never
        credited (e.g. the app closed before the recharge call completed). Lists
        the customer's owned purchases at RevenueCat and idempotently credits any
        that map to an active coin package and have not been redeemed yet.
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Updated wallet after crediting any pending purchases
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "502":
          description: RevenueCat verification temporarily unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /wallet/{userId}/purchase:
    post:
      operationId: purchaseItem
      tags: [wallet]
      summary: Buy a store item, spending from the wallet and granting ownership
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PurchaseInput"
      responses:
        "200":
          description: Result of purchase
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PurchaseResult"
        "400":
          description: Insufficient balance or already owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Item not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /wallet/{userId}/claim-task:
    post:
      operationId: claimTask
      tags: [wallet]
      summary: Claim a daily task reward, crediting the wallet
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClaimTaskInput"
      responses:
        "200":
          description: Updated wallet
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Wallet"
        "400":
          description: Already claimed today
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Task not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /wallet/{userId}/items:
    get:
      operationId: listUserItems
      tags: [wallet]
      summary: List a user's owned items
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Owned items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserItem"
  /wallet/{userId}/equip:
    post:
      operationId: equipItem
      tags: [wallet]
      summary: Equip an owned item (unequips others of the same type)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EquipInput"
      responses:
        "200":
          description: Updated owned items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UserItem"
        "400":
          description: Item not owned
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /wallet/{userId}/task-claims:
    get:
      operationId: listTaskClaims
      tags: [wallet]
      summary: List the user's task claims for today
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Today's task claims
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/TaskClaim"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    AuthMe:
      type: object
      properties:
        userId:
          type: string
        isAdmin:
          type: boolean
      required:
        - userId
        - isAdmin
    Admin:
      type: object
      required:
        - id
        - email
        - userId
        - addedBy
        - source
        - removable
      properties:
        id: { type: integer }
        email: { type: string }
        userId: { type: string }
        addedBy: { type: string }
        source: { type: string }
        removable: { type: boolean }
    AdminInput:
      type: object
      required:
        - email
      properties:
        email: { type: string, minLength: 3 }
    AdminAuditEvent:
      type: object
      required:
        - id
        - action
        - targetEmail
        - actorEmail
        - createdAt
      properties:
        id: { type: integer }
        action: { type: string }
        targetEmail: { type: string }
        actorEmail: { type: string }
        createdAt: { type: string }
    Error:
      type: object
      properties:
        error:
          type: string
      required:
        - error

    StoreItem:
      type: object
      required:
        - id
        - name
        - category
        - itemType
        - section
        - imageUrl
        - mediaUrl
        - color
        - icon
        - price
        - currency
        - vipRequired
        - durationDays
        - active
        - sortOrder
      properties:
        id: { type: integer }
        name: { type: string }
        category: { type: string }
        itemType: { type: string }
        section: { type: string }
        imageUrl: { type: string }
        mediaUrl: { type: string }
        color: { type: string }
        icon: { type: string }
        price: { type: integer }
        currency: { type: string }
        vipRequired: { type: integer }
        durationDays: { type: integer }
        active: { type: boolean }
        sortOrder: { type: integer }
    StoreItemInput:
      type: object
      required:
        - name
        - category
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        itemType: { type: string }
        section: { type: string }
        imageUrl: { type: string }
        mediaUrl: { type: string }
        color: { type: string }
        icon: { type: string }
        price: { type: integer }
        currency: { type: string }
        vipRequired: { type: integer }
        durationDays: { type: integer }
        active: { type: boolean }
        sortOrder: { type: integer }
    StoreItemUpdate:
      type: object
      properties:
        name: { type: string, minLength: 1 }
        category: { type: string, minLength: 1 }
        itemType: { type: string }
        section: { type: string }
        imageUrl: { type: string }
        mediaUrl: { type: string }
        color: { type: string }
        icon: { type: string }
        price: { type: integer }
        currency: { type: string }
        vipRequired: { type: integer }
        durationDays: { type: integer }
        active: { type: boolean }
        sortOrder: { type: integer }

    CoinPackage:
      type: object
      required:
        - id
        - name
        - coins
        - bonus
        - price
        - productId
        - color
        - icon
        - popular
        - active
        - sortOrder
      properties:
        id: { type: integer }
        name: { type: string }
        coins: { type: integer }
        bonus: { type: integer }
        price: { type: string }
        productId: { type: string }
        color: { type: string }
        icon: { type: string }
        popular: { type: boolean }
        active: { type: boolean }
        sortOrder: { type: integer }
    CoinPackageInput:
      type: object
      required:
        - coins
      properties:
        name: { type: string }
        coins: { type: integer }
        bonus: { type: integer }
        price: { type: string }
        productId: { type: string }
        color: { type: string }
        icon: { type: string }
        popular: { type: boolean }
        active: { type: boolean }
        sortOrder: { type: integer }
    CoinPackageUpdate:
      type: object
      properties:
        name: { type: string }
        coins: { type: integer }
        bonus: { type: integer }
        price: { type: string }
        productId: { type: string }
        color: { type: string }
        icon: { type: string }
        popular: { type: boolean }
        active: { type: boolean }
        sortOrder: { type: integer }

    DailyTask:
      type: object
      required:
        - id
        - label
        - description
        - reward
        - icon
        - color
        - active
        - sortOrder
      properties:
        id: { type: integer }
        label: { type: string }
        description: { type: string }
        reward: { type: integer }
        icon: { type: string }
        color: { type: string }
        active: { type: boolean }
        sortOrder: { type: integer }
    DailyTaskInput:
      type: object
      required:
        - label
      properties:
        label: { type: string, minLength: 1 }
        description: { type: string }
        reward: { type: integer }
        icon: { type: string }
        color: { type: string }
        active: { type: boolean }
        sortOrder: { type: integer }
    DailyTaskUpdate:
      type: object
      properties:
        label: { type: string, minLength: 1 }
        description: { type: string }
        reward: { type: integer }
        icon: { type: string }
        color: { type: string }
        active: { type: boolean }
        sortOrder: { type: integer }

    Wallet:
      type: object
      required:
        - userId
        - coins
        - vPoints
      properties:
        userId: { type: string }
        coins: { type: integer }
        vPoints: { type: integer }
    WalletTransaction:
      type: object
      required:
        - id
        - userId
        - currency
        - amount
        - balanceAfter
        - type
        - description
        - refId
        - createdAt
      properties:
        id: { type: integer }
        userId: { type: string }
        currency: { type: string }
        amount: { type: integer }
        balanceAfter: { type: integer }
        type: { type: string }
        description: { type: string }
        refId: { type: string }
        createdAt: { type: string }
    UserItem:
      type: object
      required:
        - id
        - userId
        - itemId
        - equipped
      properties:
        id: { type: integer }
        userId: { type: string }
        itemId: { type: integer }
        equipped: { type: boolean }
    TaskClaim:
      type: object
      required:
