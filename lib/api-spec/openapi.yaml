openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: store
    description: Store item operations
  - name: vip
    description: VIP tier and feature operations
  - name: economy
    description: Coin packages and daily task catalog operations
  - name: wallet
    description: Per-user wallet, ledger, ownership and spend/earn operations
  - name: auth
    description: Authentication and authorization operations
  - name: rooms
    description: Voice/text chat room management
  - name: dm
    description: Private direct-message conversations
  - name: social
    description: Follow relationships and social stats
  - name: profiles
    description: User directory mirrored from the auth provider
  - name: posts
    description: Moments feed (user posts and likes)
  - name: growth
    description: Invite rewards, paid hosts, scheduled events and push targets
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Current authenticated user
      description: Returns the verified user id and whether they are an admin
      responses:
        "200":
          description: Authenticated user info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthMe"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admins:
    get:
      operationId: listAdmins
      tags: [auth]
      summary: List admins
      description: Returns the bootstrap (env) owners and in-app granted admins
      responses:
        "200":
          description: List of admins
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Admin"
    post:
      operationId: createAdmin
      tags: [auth]
      summary: Grant admin access to an email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AdminInput"
      responses:
        "201":
          description: Created admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Admin"
        "400":
          description: Invalid email or already an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /admins/{id}:
    delete:
      operationId: deleteAdmin
      tags: [auth]
      summary: Revoke admin access
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "400":
          description: Cannot remove yourself
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admins/audit:
    get:
      operationId: listAdminAudit
      tags: [auth]
      summary: List admin grant/revoke history
      description: Returns the most recent admin grant and revoke actions
      responses:
        "200":
          description: List of admin audit events
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AdminAuditEvent"

  /admins/wallet-lookup/{publicId}:
    get:
      operationId: lookupWalletByPublicId
      tags: [auth]
      summary: Owner-only — look up an account by its public id
      parameters:
        - name: publicId
          in: path
          required: true
          schema:
            type: string
      responses:
        "200":
          description: The matched account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletLookup"
        "404":
          description: No account with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /admins/grant-coins:
    post:
      operationId: grantCoins
      tags: [auth]
      summary: Owner-only — send coins or diamonds to an account by public id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrantCoinsInput"
      responses:
        "200":
          description: Updated recipient account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WalletLookup"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No account with that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /store-items:
    get:
      operationId: listStoreItems
      tags: [store]
      summary: List store items
      responses:
        "200":
          description: List of store items
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/StoreItem"
    post:
      operationId: createStoreItem
      tags: [store]
      summary: Create a store item
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreItemInput"
      responses:
        "201":
          description: Created store item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreItem"
  /store-items/{id}:
    patch:
      operationId: updateStoreItem
      tags: [store]
      summary: Update a store item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StoreItemUpdate"
      responses:
        "200":
          description: Updated store item
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StoreItem"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteStoreItem
      tags: [store]
      summary: Delete a store item
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /vip-tiers:
    get:
      operationId: listVipTiers
      tags: [vip]
      summary: List VIP tiers
      responses:
        "200":
          description: List of VIP tiers
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VipTier"
    post:
      operationId: createVipTier
      tags: [vip]
      summary: Create a VIP tier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VipTierInput"
      responses:
        "201":
          description: Created VIP tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VipTier"
  /vip-tiers/{id}:
    patch:
      operationId: updateVipTier
      tags: [vip]
      summary: Update a VIP tier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VipTierUpdate"
      responses:
        "200":
          description: Updated VIP tier
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VipTier"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteVipTier
      tags: [vip]
      summary: Delete a VIP tier
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /vip-features:
    get:
      operationId: listVipFeatures
      tags: [vip]
      summary: List VIP features
      responses:
        "200":
          description: List of VIP features
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/VipFeature"
    post:
      operationId: createVipFeature
      tags: [vip]
      summary: Create a VIP feature
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VipFeatureInput"
      responses:
        "201":
          description: Created VIP feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VipFeature"
  /vip-features/{id}:
    patch:
      operationId: updateVipFeature
      tags: [vip]
      summary: Update a VIP feature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VipFeatureUpdate"
      responses:
        "200":
          description: Updated VIP feature
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VipFeature"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteVipFeature
      tags: [vip]
      summary: Delete a VIP feature
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /coin-packages:
    get:
      operationId: listCoinPackages
      tags: [economy]
      summary: List coin packages
      responses:
        "200":
          description: List of coin packages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/CoinPackage"
    post:
      operationId: createCoinPackage
      tags: [economy]
      summary: Create a coin package
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoinPackageInput"
      responses:
        "201":
          description: Created coin package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoinPackage"
  /coin-packages/{id}:
    patch:
      operationId: updateCoinPackage
      tags: [economy]
      summary: Update a coin package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CoinPackageUpdate"
      responses:
        "200":
          description: Updated coin package
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CoinPackage"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteCoinPackage
      tags: [economy]
      summary: Delete a coin package
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /daily-tasks:
    get:
      operationId: listDailyTasks
      tags: [economy]
      summary: List daily tasks
      responses:
        "200":
          description: List of daily tasks
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DailyTask"
    post:
      operationId: createDailyTask
      tags: [economy]
      summary: Create a daily task
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyTaskInput"
      responses:
        "201":
          description: Created daily task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyTask"
  /daily-tasks/{id}:
    patch:
      operationId: updateDailyTask
      tags: [economy]
      summary: Update a daily task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DailyTaskUpdate"
      responses:
        "200":
          description: Updated daily task
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DailyTask"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteDailyTask
      tags: [economy]
      summary: Delete a daily task
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /rooms:
    get:
      operationId: listRooms
      tags: [rooms]
      summary: List active rooms
      responses:
        "200":
          description: List of active rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
    post:
      operationId: createRoom
      tags: [rooms]
      summary: Create a room owned by the authenticated user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomInput"
      responses:
        "201":
          description: Created room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rooms/mine:
    get:
      operationId: listMyRooms
      tags: [rooms]
      summary: List rooms owned by the authenticated user
      responses:
        "200":
          description: List of my rooms
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Room"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rooms/{id}:
    get:
      operationId: getRoom
      tags: [rooms]
      summary: Get a room by id
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateRoom
      tags: [rooms]
      summary: Update a room (owner or admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RoomUpdate"
      responses:
        "200":
          description: Updated room
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Room"
        "403":
          description: Not the room owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteRoom
      tags: [rooms]
      summary: Delete a room (owner or admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "403":
          description: Not the room owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /dm/conversations:
    get:
      operationId: listConversations
      tags: [dm]
      summary: List the authenticated user's conversations, newest first
      responses:
        "200":
          description: Conversations shaped for the requesting user
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Conversation"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dm/open:
    post:
      operationId: openConversation
      tags: [dm]
      summary: Open (or create) a conversation with another user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OpenConversationInput"
      responses:
        "200":
          description: The conversation with the other user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Conversation"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dm/conversations/{id}/messages:
    get:
      operationId: listDmMessages
      tags: [dm]
      summary: List messages in a conversation (participants only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Messages, oldest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DmMessage"
        "403":
          description: Not a participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /dm/conversations/{id}/read:
    post:
      operationId: markConversationRead
      tags: [dm]
      summary: Reset the authenticated user's unread counter for a conversation
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Marked read
        "403":
          description: Not a participant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /blocks:
    get:
      operationId: listBlocks
      tags: [safety]
      summary: Accounts I have blocked
      responses:
        "200":
          description: Blocked accounts
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BlockedUser"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: blockUser
      tags: [safety]
      summary: Block an account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BlockInput"
      responses:
        "204":
          description: Blocked
        "400":
          description: Invalid target
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /blocks/{targetUserId}:
    delete:
      operationId: unblockUser
      tags: [safety]
      summary: Unblock an account
      parameters:
        - name: targetUserId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Unblocked
  /reports:
    get:
      operationId: listReports
      tags: [safety]
      summary: Review queue (admin only)
      responses:
        "200":
          description: Reports, newest first
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Report"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createReport
      tags: [safety]
      summary: Report a user, room, post or message
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportInput"
      responses:
        "204":
          description: Reported
        "400":
          description: Invalid report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /reports/{id}:
    patch:
      operationId: reviewReport
      tags: [safety]
      summary: Resolve a report (admin only)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReportReviewInput"
      responses:
        "204":
          description: Reviewed
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /bans:
    get:
      operationId: listBans
      tags: [safety]
      summary: Suspended accounts (admin only)
      responses:
        "200":
          description: Suspensions
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/BanEntry"
        "403":
          description: Not an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    post:
      operationId: createBan
      tags: [safety]
      summary: Suspend an account by public id (admin only)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/BanInput"
      responses:
        "204":
          description: Suspended
        "400":
          description: Unknown account or target is an admin
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /bans/{userId}:
    delete:
      operationId: deleteBan
      tags: [safety]
      summary: Lift a suspension (admin only)
      parameters:
        - name: userId
          in: path
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Lifted
        "404":
          description: Not suspended
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /rooms/{id}/kick:
    post:
      operationId: kickFromRoom
      tags: [safety]
      summary: Remove someone from a room (owner or admin)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/KickInput"
      responses:
        "200":
          description: Removed
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/KickResult"
        "403":
          description: Not the room owner
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /account:
    delete:
      operationId: deleteMyAccount
      tags: [safety]
      summary: Permanently delete my account and its content
      responses:
        "204":
          description: Deleted
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /referrals/me:
    get:
      operationId: getMyReferral
      tags: [growth]
      summary: My invite code, how many joined, and whether I already used one
      responses:
        "200":
          description: Invite status
          content:
            application/json:
              schema:
